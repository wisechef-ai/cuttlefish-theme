name: p1-tools

# P1 design-sprint shared tooling: fixture freshness + contract, direction modules, gates.
on:
  push:
    branches: [v22, "agent/**"]
    paths: ["tools/p1/**", "tools/tests/test_p1_*.py", "tools/tests/p1_*.test.mjs", "tools/capture_tui.py",
            "tests/test_capture_tui_sequence.py", "design/**", "gates/**", ".github/workflows/p1-tools.yml"]
  pull_request:
    branches: [v22]
    paths: ["tools/p1/**", "tools/tests/test_p1_*.py", "tools/tests/p1_*.test.mjs", "tools/capture_tui.py",
            "tests/test_capture_tui_sequence.py", "design/**", "gates/**", ".github/workflows/p1-tools.yml"]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: python -m pip install pytest -r tools/requirements-capture.txt -r gates/requirements.txt
      - run: python tools/p1/make_stub_sessions.py --check
      # The harness end-to-end test drives the REAL `hermes --tui` (virtual pty backend). Build upstream's TUI
      # bundle in a throwaway clone; nothing of hermes-agent is vendored here.
      - name: build the upstream hermes TUI (for the harness e2e test)
        run: |
          git clone -q --depth 1 https://github.com/NousResearch/hermes-agent.git "$RUNNER_TEMP/hermes-agent"
          cd "$RUNNER_TEMP/hermes-agent"
          echo "HERMES_UPSTREAM_SHA=$(git rev-parse --short=11 HEAD)" >> "$GITHUB_ENV"
          npm ci --workspace ui-tui --include-workspace-root=false --no-audit --no-fund --ignore-scripts
          (cd ui-tui && npm run build)
          test -f ui-tui/dist/entry.js
      - run: python -m pytest -v tools/tests/test_p1_*.py tests/test_capture_tui_sequence.py
        env:
          CF_HERMES_SRC: ${{ runner.temp }}/hermes-agent
      - run: node --test tools/tests/p1_tui_adapter.test.mjs tools/tests/p1_desktop_stub.test.mjs
      - run: python -m pytest -v gates/tests   # gate instruments: pure maths + fixture renders; model calls are local evidence only
