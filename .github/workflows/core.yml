name: core

# packages/core: pure domain + ports + app. Oracle parity against design/directions/d-dots, identity
# golden vectors (cross-checked against python hashlib), state reducers + replayer, property tests, and the
# two committed bundles (desktop/core.bundle.js, tui/core.bundle.mjs) which must equal a fresh build.
# D2: the WebGL shader and its `shader-gpu` job are deleted (CONTEXT-D2 §2); XL is canvas 2D. The scatter grammar is
# pinned by python/domain/dots.py -> fixtures/dots-vectors.json (exact glyph + rgb parity).
on:
  push:
    branches: [v22, "agent/**"]
    paths: ["packages/core/**", "desktop/core.bundle.js", "tui/core.bundle.mjs", "tools/traces/**", ".github/workflows/core.yml"]
  pull_request:
    branches: [v22]
    paths: ["packages/core/**", "desktop/core.bundle.js", "tui/core.bundle.mjs", "tools/traces/**", ".github/workflows/core.yml"]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm test
      # Generated artefacts must be fresh (regenerate -> no diff).
      - run: node tools/gen-tokens.mjs --check
      - run: node tools/gen-identity-vectors.mjs --check
      - run: python3 tools/gen-blake2b-vectors.py --check
      - run: python3 ../../tools/gen-dots-vectors.py --check

  bundles-fresh:
    # The hosts consume the COMMITTED bundles, so a source change without `npm run build` must fail here.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - run: npm ci
        working-directory: packages/core
      - run: npm run build
        working-directory: packages/core
      - name: committed bundles must equal a fresh build
        run: |
          git diff --exit-code -- desktop/core.bundle.js tui/core.bundle.mjs
          test -z "$(git status --porcelain -- desktop/core.bundle.js tui/core.bundle.mjs)"

  trace-parity:
    # G0: replay every recorded trace through BOTH committed bundles; core-dot parity of the desktop traces must have no MISMATCH.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - run: npm ci
        working-directory: packages/core
      - run: npm run build
        working-directory: packages/core
      - name: parity by trace (exit 1 bundles differ | 2 state unreached | 3 core-dot MISMATCH)
        run: node tools/traces/parity.mjs --require-all
