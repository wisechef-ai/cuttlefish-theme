name: core

# packages/core: pure domain + ports + app. Oracle parity against design/directions/d-dots, identity
# golden vectors (cross-checked against python hashlib), state reducers + replayer, property tests, and the
# two committed bundles (desktop/core.bundle.js, tui/core.bundle.mjs) which must equal a fresh build.
# shader-gpu: XL WebGL2 shader vs the CPU pattern in headless Chromium (SwiftShader).
on:
  push:
    branches: [v22, "agent/**"]
    paths: ["packages/core/**", "desktop/core.bundle.js", "tui/core.bundle.mjs", "tools/traces/**", ".github/workflows/core.yml"]
  pull_request:
    branches: [v22]
    paths: ["packages/core/**", "desktop/core.bundle.js", "tui/core.bundle.mjs", "tools/traces/**", ".github/workflows/core.yml"]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm test
      # Generated artefacts must be fresh (regenerate -> no diff).
      - run: node tools/gen-tokens.mjs --check
      - run: node tools/gen-identity-vectors.mjs --check
      - run: python3 tools/gen-blake2b-vectors.py --check

  bundles-fresh:
    # The hosts consume the COMMITTED bundles, so a source change without `npm run build` must fail here.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - run: npm ci
        working-directory: packages/core
      - run: npm run build
        working-directory: packages/core
      - name: committed bundles must equal a fresh build
        run: |
          git diff --exit-code -- desktop/core.bundle.js tui/core.bundle.mjs
          test -z "$(git status --porcelain -- desktop/core.bundle.js tui/core.bundle.mjs)"

  trace-parity:
    # G0: replay every recorded trace through BOTH committed bundles; core-dot parity of the desktop traces must have no MISMATCH.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - run: npm ci
        working-directory: packages/core
      - run: npm run build
        working-directory: packages/core
      - name: parity by trace (exit 1 bundles differ | 2 state unreached | 3 core-dot MISMATCH)
        run: node tools/traces/parity.mjs --require-all

  shader-gpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Install Playwright + Chromium (pinned by tools/package-lock.json)
        working-directory: tools
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - run: npm ci
        working-directory: packages/core
      - name: "GPU parity (CF_REQUIRE_GPU=1 makes missing Chromium a failure, never a skip)"
        working-directory: packages/core
        run: |
          set -o pipefail
          CF_REQUIRE_GPU=1 node --test "test/shader/*.test.ts" 2>&1 | tee ../../shader-gpu.log
      - name: Prove the GPU tests EXECUTED (not skipped)
        run: |
          grep -E '^# GPU parity renderer: .*(SwiftShader|WebGL)' shader-gpu.log
          grep -E '^# 72 scenes, all >= 99.5 % exact' shader-gpu.log
          grep -E '^# planted lattice bug: worst-scene exact' shader-gpu.log
          grep -E '^ℹ skipped 0$' shader-gpu.log
          grep -E '^ℹ fail 0$' shader-gpu.log
