name: python-half

# v22 Python (agent) half: domain, identity store, bus, hooks, dashboard API, contract vectors.
on:
  push:
    branches: ["agent/**"]
    paths: ["python/**", "dashboard/**", "__init__.py", "plugin.yaml", "packages/core/spec/**",
            "tools/make_contract_vectors.py", ".github/workflows/python-half.yml"]
  pull_request:
    branches: [v22]
    paths: ["python/**", "dashboard/**", "__init__.py", "plugin.yaml", "packages/core/spec/**",
            "tools/make_contract_vectors.py", ".github/workflows/python-half.yml"]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install pytest fastapi httpx pyyaml
      - run: python tools/make_contract_vectors.py --check
      - run: python -m pytest python/tests -q -s
