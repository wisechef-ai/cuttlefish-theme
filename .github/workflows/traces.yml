name: traces

# Recorded host traces (tools/traces/*.jsonl): the converter's privacy whitelist and the recording-level claims of every
# shipped trace. Pure Python, no host, no model: re-recording is local (tools/traces/README.md).
on:
  push:
    branches: [v22, "agent/**"]
    paths: ["tools/traces/**", "tests/test_traces_*.py", ".github/workflows/traces.yml"]
  pull_request:
    branches: [v22]
    paths: ["tools/traces/**", "tests/test_traces_*.py", ".github/workflows/traces.yml"]

permissions:
  contents: read

concurrency:
  group: traces-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python tools/traces/record/check.py
      - run: python -m pytest tests/test_traces_convert.py tests/test_traces_shipped.py -v -p no:cacheprovider
      - name: privacy gate (must print nothing)
        run: "! grep -inE 'adam|/home/|api[_-]?key|sk-|token|password' tools/traces/*.jsonl"
