name: traces

# Static checks on the spike 06 replay fixtures (no reducer, no vault access).
on:
  push:
    branches: [v22, "agent/**"]
    paths: ["tools/traces/**", ".github/workflows/traces.yml"]
  pull_request:
    branches: [v22]
    paths: ["tools/traces/**", ".github/workflows/traces.yml"]

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python tools/traces/spike06/author_expected.py --check
      - run: python -m pytest -v tools/traces/spike06
