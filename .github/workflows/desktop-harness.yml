name: desktop-harness

# Unit tests for the P0-DESK Playwright harness (tools/desktop_harness.ts) and the
# desktop spike fixtures/runner (tools/spikes/). No Electron and no display here:
# the spikes themselves need a built Hermes desktop + Xvfb and run locally via
# tools/spikes/run-desktop.sh; CI pins the parts a re-run silently depends on.
on:
  push:
    branches: [v22, "agent/**"]
    paths: ["tools/**", ".github/workflows/desktop-harness.yml"]
  pull_request:
    branches: [v22]
    paths: ["tools/**", ".github/workflows/desktop-harness.yml"]

permissions:
  contents: read

concurrency:
  group: desktop-harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - run: python -m pip install -r tools/requirements-desktop-tests.txt
      # The P1 harness end-to-end tests need a built hermes TUI; p1-tools.yml builds one and runs them for real.
      - run: python -m pytest tools/tests -v -p no:cacheprovider
        env:
          CF_P1_ALLOW_NO_TUI: "1"
      - run: npm ci --no-audit --no-fund
        working-directory: tools
      - run: npm test
        working-directory: tools
